    <style>
        :root {
            /* Eticket exact color scheme */
            --primary-color: #1e40af;
            --secondary-color: #1e3a8a;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --border-color: #e5e7eb;
            --border-light: #f3f4f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --border-radius: 8px;
            --border-radius-lg: 12px;
            --border-radius-xl: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Estilos para navbar flotante en móvil */

            /* Items de navegación */
            . {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-decoration: none;
                color: #8e8e93;
                transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                padding: 8px 12px;
                border-radius: 16px;
                min-width: 64px;
                position: relative;
                overflow: hidden;
            }

            .::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(135deg, #0c3872, #1e4a7a);
                opacity: 0;
                transition: opacity 0.3s ease;
                border-radius: 16px;
            }

            .:hover {
                text-decoration: none;
                color: #0c3872;
                transform: translateY(-2px);
            }

            .:hover::before {
                opacity: 0.08;
            }

            ..active {
                color: #0c3872;
                background: linear-gradient(135deg, rgba(12, 56, 114, 0.1), rgba(30, 74, 122, 0.05));
                box-shadow: 0 4px 16px rgba(12, 56, 114, 0.2);
                transform: translateY(-1px);
            }

            ..active::after {
                content: '';
                width: 24px;
                height: 3px;
                background: linear-gradient(90deg, #0c3872, #1e4a7a);
                border-radius: 2px;
                margin-top: 4px;
                box-shadow: 0 2px 8px rgba(12, 56, 114, 0.3);
            }

            /* Iconos */
            . .lnr {
                font-size: 22px;
                margin-bottom: 4px;
                transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                position: relative;
                z-index: 1;
            }

            ..active .lnr {
                color: #0c3872;
                transform: scale(1.1);
            }

            /* Texto de los items */
            . span {
                font-size: 11px;
                font-weight: 600;
                text-align: center;
                line-height: 1.2;
                position: relative;
                z-index: 1;
                letter-spacing: 0.3px;
            }

            /* Dropdown moderno para Accesos Estudiantes */
            .bubble-nav-dropdown {
                position: relative;
            }

            .bubble-nav-dropdown-content {
                display: none;
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1);
                padding: 20px;
                min-width: 300px;
                max-width: 90vw;
                border: 1px solid rgba(255, 255, 255, 0.2);
                z-index: 1001;
            }

            .bubble-nav-dropdown-content.show {
                display: block;
                animation: slideUpDropdownModern 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }

            @keyframes slideUpDropdownModern {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(-30px) scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0) scale(1);
                }
            }

            .bubble-nav-dropdown-item {
                display: block;
                padding: 14px 18px;
                color: #333333;
                text-decoration: none;
                border-radius: 12px;
                margin: 3px 0;
                transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                font-size: 14px;
                font-weight: 500;
                position: relative;
                overflow: hidden;
            }

            .bubble-nav-dropdown-item::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(12, 56, 114, 0.1), transparent);
                transition: left 0.5s ease;
            }

            .bubble-nav-dropdown-item:hover {
                background: linear-gradient(135deg, rgba(12, 56, 114, 0.08), rgba(30, 74, 122, 0.05));
                color: #0c3872;
                text-decoration: none;
                transform: translateX(4px);
                box-shadow: 0 4px 12px rgba(12, 56, 114, 0.15);
            }

            .bubble-nav-dropdown-item:hover::before {
                left: 100%;
            }

            /* Overlay mejorado para cerrar dropdown */
            .bubble-nav-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px);
                z-index: 999;
                display: none;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .bubble-nav-overlay.show {
                display: block;
                opacity: 1;
            }

            /* Ajustes para diferentes tamaños de pantalla */
            @media (max-width: 480px) {

                . {
                    min-width: 56px;
                    padding: 6px 8px;
                }
                
                . .lnr {
                    font-size: 20px;
                }
                
                . span {
                    font-size: 10px;
                }

                .bubble-nav-dropdown-content {
                    top: 90px;
                    min-width: 280px;
                    padding: 16px;
                }
            }

            /* Animación de entrada flotante para la navbar */
            @keyframes floatIn {
                from {
                    transform: translateX(-50%) translateY(-100px) scale(0.8);
                    opacity: 0;
                }
                to {
                    transform: translateX(-50%) translateY(0) scale(1);
                    opacity: 1;
                }
            }

            /* Efecto de pulso para el item activo */
            ..active .lnr {
                animation: pulseActive 2s infinite;
            }

            @keyframes pulseActive {
                0%, 100% {
                    box-shadow: 0 0 0 0 rgba(12, 56, 114, 0.4);
                }
                50% {
                    box-shadow: 0 0 0 8px rgba(12, 56, 114, 0);
                }
            }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        .binary-column {
            position: absolute;
            top: -100%;

            font-family: 'Courier New', monospace;

        @keyframes binaryFall {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            5% {
                opacity: 0.8;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            95% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;

        /* Contenido Principal con Glassmorphism */

            padding: 80px 0;

            position: relative;
        }

        .main-content::before {
            content: '';

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(49, 130, 206, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(99, 179, 237, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

            background: var(--bg-primary);
            border-radius: var(--border-radius-lg);

    <!-- JavaScript con Detección Directa de Color -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Solo ejecutar en dispositivos móviles
            if (window.innerWidth <= 768) {
                const navItems = document.querySelectorAll('.floating-mobile-nav .nav-item');
                let activeItem = null;

                // Función para establecer item activo
                function setActiveNavItem(item) {
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    activeItem = item;
                }

                // Sistema DIRECTO de detección de color basado en scroll
                const DirectColorDetector = {
                    currentState: null,
                    lastUpdate: 0,
                    
                    // Detectar si estamos sobre fondo claro u oscuro basado en posición de scroll
                    detectBackgroundType() {
                        const navbar = document.getElementById('floatingMobileNav');
                        if (!navbar) return 'dark'; // Default a oscuro
                        
                        const rect = navbar.getBoundingClientRect();
                        const centerY = rect.top + rect.height / 2;
                        
                        // Si el navbar está en la parte superior de la pantalla (sobre el header azul)
                        if (centerY < window.innerHeight * 0.6) {
                            return 'dark'; // Header azul oscuro
                        } else {
                            return 'light'; // Contenido blanco
                        }
                    },
                    
                    // Actualizar colores basado en posición
                    update() {
                        const now = Date.now();
                        if (now - this.lastUpdate < 100) return; // Throttle
                        
                        const backgroundType = this.detectBackgroundType();
                        
                        // Solo actualizar si el estado cambió
                        if (this.currentState !== backgroundType) {
                            this.currentState = backgroundType;
                            
                            navItems.forEach(item => {
                                item.style.transition = 'color 0.4s ease';
                                
                                if (backgroundType === 'dark') {
                                    // Fondo oscuro - texto blanco
                                    item.style.color = 'rgba(255, 255, 255, 0.95)';
                                    item.style.textShadow = '0 1px 2px rgba(0, 0, 0, 0.3)';
                                    item.style.fontWeight = '600';
                                } else {
                                    // Fondo claro - texto negro
                                    item.style.color = 'rgba(0, 0, 0, 0.85)';
                                    item.style.textShadow = '0 1px 2px rgba(255, 255, 255, 0.5)';
                                    item.style.fontWeight = '500';
                                }
                            });
                            
                            this.lastUpdate = now;
                        }
                    }
                };

                // Inicializar sistema directo basado en posición
                const initDirectColorDetection = () => {
                    // Actualización inicial
                    DirectColorDetector.update();
                    
                    // Eventos optimizados
                    let scrollTimer;
                    let resizeTimer;
                    
                    // Scroll con throttling - esto es clave para la detección
                    window.addEventListener('scroll', () => {
                        if (scrollTimer) return;
                        scrollTimer = setTimeout(() => {
                            DirectColorDetector.update();
                            scrollTimer = null;
                        }, 50); // Más rápido para mejor respuesta
                    }, { passive: true });
                    
                    // Resize con debounce
                    window.addEventListener('resize', () => {
                        if (resizeTimer) clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(() => DirectColorDetector.update(), 200);
                    });
                    
                    // Actualización después de cargar
                    window.addEventListener('load', () => {
                        setTimeout(() => DirectColorDetector.update(), 300);
                    });
                };

                // Inicialización directa
                setTimeout(initDirectColorDetection, 100);
                setTimeout(() => DirectColorDetector.update(), 300);

                // Efectos táctiles para móviles
                navItems.forEach(item => {
                    let isPressed = false;
                    let pressTimer = null;

                    // Efecto de presión en touch
                    item.addEventListener('touchstart', function(e) {
                        isPressed = true;
                        this.style.transform = 'scale(0.95) translateY(2px)';
                        this.style.transition = 'all 0.1s ease';
                        
                        pressTimer = setTimeout(() => {
                            if (isPressed) {
                                this.style.transform = 'scale(0.9) translateY(4px)';
                                this.style.boxShadow = '0 2px 8px rgba(0, 0, 0, 0.15)';
                            }
                        }, 100);
                    }, { passive: true });

                    item.addEventListener('touchend', function(e) {
                        isPressed = false;
                        clearTimeout(pressTimer);
                        
                        setTimeout(() => {
                            this.style.transform = '';
                            this.style.transition = 'all 0.3s ease';
                        }, 50);
                    }, { passive: true });

                    // Cancelar efecto si el usuario arrastra fuera del elemento
                    item.addEventListener('touchcancel', function(e) {
                        isPressed = false;
                        clearTimeout(pressTimer);
                        
                        this.style.transform = '';
                        this.style.transition = 'all 0.3s ease';
                    }, { passive: true });

                    // Manejar clics
                    item.addEventListener('click', function(e) {
                        if (!this.classList.contains('active')) {
                            setActiveNavItem(this);
                        }
                        
                        setTimeout(() => {
                            // El navegador manejará la navegación automáticamente
                        }, 100);
                    });
                });

                // Manejar cambios de tamaño de ventana
                window.addEventListener('resize', function() {
                    const floatingNav = document.getElementById('floatingMobileNav');
                    const desktopNav = document.getElementById('header-navbar');

                    if (window.innerWidth <= 768) {
                        if (floatingNav) floatingNav.style.display = 'block';
                        if (desktopNav) desktopNav.style.display = 'none';
                    } else {
                        if (floatingNav) floatingNav.style.display = 'none';
                        if (desktopNav) desktopNav.style.display = 'block';
                    }
                });
            }
        });
    </script>
